# Bun configuration — https://bun.sh/docs/runtime/bunfig
#
# There is deliberately no [install] section: hardlink backend, the global
# package cache and installing optionalDependencies are all Bun defaults
# (verified on 1.4.2 — `bun install --help` documents "hardlink" as the backend
# default, and a bunfig-less install of a package with platform
# optionalDependencies still resolves its native binding). Re-add a key here
# only to depart from a default, never to restate one.

# Plugins for Bun's HTML-import bundler. Loaded lazily by Bun.serve when routes
# are bundled, i.e. only while the dev server runs.
# See: apps/web/dev-server.ts
[serve.static]
plugins = ["bun-plugin-tailwind", "./apps/web/bun-plugin-data-component.ts", "./apps/web/bun-plugin-build-config.ts", "./apps/web/bun-plugin-web-assets.ts"]
