services:
  vibe_tavern:
    container_name: vibe_tavern
    image: ghcr.io/noineri/vibe_tavern:latest
    # Optional override for the QR-code IP/hostname. Auto-detected under host
    # networking; only needed for: multiple NICs, a custom domain/Tailscale name,
    # or the bridge-network fallback (Docker Desktop Mac/Windows).
    # environment:
      # VIBE_TAVERN_EXTERNAL_HOST: vibe.lan.myhouse.net
    network_mode: host # Workaraund to make a token system actually work in docker.
    volumes:
      - data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8787/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
