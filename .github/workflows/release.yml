name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Release pipeline (tag-driven, immutable):
#
#   1. Cut a release locally:
#        bun run bump-version 1.0.2 --push
#      That script bumps all 8 workspace package.json files, syncs bun.lock,
#      commits with [skip ci], creates an ANNOTATED tag v1.0.2, and pushes
#      both master and the tag. No force-push anywhere.
#
#   2. This workflow triggers on the tag push. The `version` job is a GUARD,
#      not a mutator: it verifies package.json .version == tag version and
#      fails fast with a clear message if they diverge. It does NOT commit,
#      does NOT push, does NOT rewrite the tag.
#
#   3. Build jobs checkout the tagged commit (immutable) and run on it.
#
#   4. `publish` is gated by the full needs: chain — atomic release creation.
#
# Tag immutability is enforced: this workflow never force-pushes tags or
# master. If a build fails, fix forward on master and cut a new tag.

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        # No `ref:` — checkout the tagged commit. Do NOT checkout master:
        # the tag may legitimately live on a release/* hotfix branch.
      - name: Set VERSION from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Verify package.json version matches tag
        run: |
          set -euo pipefail
          PKG_VERSION=$(jq -r '.version' package.json)
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::Tag is v${VERSION} but package.json is v${PKG_VERSION}."
            echo "::error::Run: bun run bump-version ${VERSION} --push"
            exit 1
          fi
          echo "OK: tag v${VERSION} matches package.json v${PKG_VERSION}"
          echo "Building commit: $(git rev-parse HEAD)"

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Set VERSION from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun scripts/install-platform-optionals.ts
      - run: bun scripts/build-linux-dist.ts
      - name: Rename to release name
        run: |
          mv out/vibe-tavern-linux-x64.tar.gz \
             out/Vibe-Tavern-v${VERSION}-linux.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-linux-tarball
          path: out/Vibe-Tavern-v${{ env.VERSION }}-linux.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Set VERSION from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Set Android versionCode/versionName
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          # Room for 999 minor and 999 patch before any collision.
          # Old formula (MAJOR*10000 + MINOR*100 + PATCH) broke at MINOR=100.
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          sed -i \
            -e "s/versionCode = [0-9]*/versionCode = ${VERSION_CODE}/" \
            -e "s|versionName = \"[^\"]*\"|versionName = \"${VERSION}\"|" \
            mobile/android/app/build.gradle.kts
      - name: Restore Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing required Android signing secret: ${variable}"
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/vibe-tavern-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun scripts/install-platform-optionals.ts
      - run: bun scripts/build-android-arm64.ts
      - name: Stage tarball in Android assets
        run: |
          mkdir -p mobile/android/app/src/main/assets
          cp out/vibe-tavern-android-arm64.tar.gz \
             mobile/android/app/src/main/assets/vibe-tavern-android-arm64.tgz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease
      - name: Verify APK signature
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs mobile/android/app/build/outputs/apk/release/app-release.apk
      - name: Rename APK
        run: |
          mv mobile/android/app/build/outputs/apk/release/app-release.apk \
             out/Vibe-Tavern-v${VERSION}-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-android-apk
          path: out/Vibe-Tavern-v${{ env.VERSION }}-android.apk
          if-no-files-found: error
          retention-days: 7

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Set VERSION from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun scripts/install-platform-optionals.ts
      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes
      - run: bun scripts/build-installer.ts
        env:
          ISCC_PATH: "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe"
      - run: bun scripts/build-windows-dist.ts
      - name: Rename artifacts
        shell: pwsh
        run: |
          Move-Item out/installer/vibe-tavern-setup.exe `
                     out/Vibe-Tavern-v${{ env.VERSION }}-windows-setup.exe -Force
          Move-Item out/vibe-tavern-windows-x64.zip `
                     out/Vibe-Tavern-v${{ env.VERSION }}-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-windows-installer
          path: out/Vibe-Tavern-v${{ env.VERSION }}-windows-setup.exe
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-windows-zip
          path: out/Vibe-Tavern-v${{ env.VERSION }}-windows.zip
          if-no-files-found: error
          retention-days: 7

  build-docker:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Set VERSION from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Set lowercase image name (GHCR requires lowercase)
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [version, build-linux, build-android, build-windows, build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Set VERSION from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          path: release-assets/
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd release-assets/
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          name: v${{ env.VERSION }}
