name: CI

on:
  push:
    branches: [master, dev]
    paths-ignore:
      - '**/*.md'
      - '**/*.sh'
      - '**/*.bat'
      - 'assets/**'
      - 'docs/**'
  pull_request:
    branches: [master, dev]
    paths-ignore:
      - '**/*.md'
      - '**/*.sh'
      - '**/*.bat'
      - 'assets/**'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI verifies the full platform build matrix on every push/PR — BEFORE a tag is
# ever cut. This replaces the old separate dry-run.yml (deleted).
#
# Gating model:
#   - typecheck, test-linux, and test-windows are all blocking. Linux runs the
#     full `bun run test` suite; Windows runs everything with platform-sensitive
#     behaviour to pin, because the repo ships a Windows installer and the
#     filesystem/Glob semantics differ there. What Windows skips, and why, is
#     declared in scripts/test.ts (`skipOnWindows`) and in the two
#     `skipIf(process.platform === "win32")` gates in scripts/*.test.ts —
#     not here, so a dev running `bun run test` locally sees the same thing CI does.
#   - The 4 platform builds fan out after typecheck passes.
# Nothing is published; the docker job only loads locally to prove the image builds.
# Build artifacts are intentionally NOT uploaded — CI verifies compilation only,
# not distribution. release.yml re-builds from the tag when cutting a real release;
# uploading throwaway 0.0.0-ci artifacts here only burned Actions storage quota.
#
# Skipping the version-bump commit: `scripts/bump-version.ts` produces exactly one
# commit, `chore: bump to vX.Y.Z`, whose parent CI already verified and whose
# content is version strings only — release.yml then re-runs this entire gate on
# the tagged commit. Running it here too is pure duplication. This is done with a
# job-level `if` and NOT with `[skip ci]` in the commit message: `[skip ci]` is
# evaluated per push event, so it would also kill the tag push that triggers
# release.yml. The three root jobs carry the condition; the build jobs inherit it
# through `needs: [typecheck]` (a skipped dependency skips its dependents). The
# prefix is spelled out inline because the `env` context is not available to a
# job-level `if` — keep it in sync with the script.

jobs:
  typecheck:
    # Quoted: a plain YAML scalar may not contain ": ", which the prefix does.
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: bump to v') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test-linux:
    # Quoted: a plain YAML scalar may not contain ": ", which the prefix does.
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: bump to v') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run test

  test-windows:
    # Quoted: a plain YAML scalar may not contain ": ", which the prefix does.
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: bump to v') }}"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run test

  build-linux:
    needs: [typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-linux-dist.ts

  build-android:
    needs: [typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-android-arm64.ts
      - name: Stage tarball in Android assets
        run: |
          mkdir -p mobile/android/app/src/main/assets
          cp out/vibe-tavern-android-arm64.tar.gz \
             mobile/android/app/src/main/assets/vibe-tavern-android-arm64.tgz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug
        working-directory: mobile/android

  build-windows:
    needs: [typecheck]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes
      # --fast-compression: this installer is never uploaded (see the note at the
      # top of the file), so the compile is the whole point and lzma2/ultra64
      # over a solid block was spending ~95s of a ~108s step on a ~100 MB binary
      # that gets deleted with the runner. release.yml builds the shipped one at
      # full compression. Never add this flag there.
      - run: bun scripts/build-installer.ts --fast-compression
        env:
          ISCC_PATH: "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe"
      - run: bun scripts/build-windows-dist.ts

  # The npm channel is verified in two stages, mirroring how it actually ships:
  # packed ONCE on Linux (that tarball is what reaches the registry), then
  # installed for real on all three platforms. Building per-OS would test three
  # artifacts nobody publishes; this tests the one that is.
  build-npm:
    needs: [typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-npm-dist.ts
      # Validates the generated manifest and the file list against the registry's
      # rules without publishing anything. Catches a malformed `bin`, a missing
      # LICENSE, or a `repository.url` that would fail trusted publishing.
      - name: Validate publishable manifest
        run: npm publish --dry-run
        working-directory: out/npm-dist
      - name: Pack tarball
        run: npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: out/npm-dist
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/*.tgz
          if-no-files-found: error
          retention-days: 7

  smoke-npm:
    needs: [build-npm]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      # No `bun install` — the point is to install the PACKAGED artifact the way
      # a user does. Repo node_modules would only hide a missing bundled dep.
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: npm-artifact
      - run: bun scripts/smoke-npm-install.ts npm-artifact

  # Self-update needs two versions to exist in a resolvable registry, so it
  # cannot be folded into smoke-npm. Linux only: the thing under test is the
  # update pipeline, not platform filesystem behaviour, and smoke-npm already
  # covers the install on all three.
  selfupdate-npm:
    needs: [typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun scripts/smoke-npm-selfupdate.ts

  build-docker:
    needs: [typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # NOTE: NO docker/login-action — we don't push. Only verify the image builds.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vibe-tavern:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
