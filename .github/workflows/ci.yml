name: CI

on:
  push:
    branches: [master, dev]
    paths-ignore:
      - '**/*.md'
      - '**/*.sh'
      - '**/*.bat'
      - 'assets/**'
      - 'docs/**'
  pull_request:
    branches: [master, dev]
    paths-ignore:
      - '**/*.md'
      - '**/*.sh'
      - '**/*.bat'
      - 'assets/**'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI verifies the full platform build matrix on every push/PR — BEFORE a tag is
# ever cut. This replaces the old separate dry-run.yml (deleted).
#
# Gating model:
#   - typecheck, test-linux, and test-windows are all blocking. The full
#     `bun run test` suite runs on both platforms because the repo ships a
#     Windows installer and the filesystem/Glob semantics are platform-sensitive.
#   - The 4 platform builds fan out after typecheck passes.
# Nothing is published; the docker job only loads locally to prove the image builds.
# Build artifacts are intentionally NOT uploaded — CI verifies compilation only,
# not distribution. release.yml re-builds from the tag when cutting a real release;
# uploading throwaway 0.0.0-ci artifacts here only burned Actions storage quota.
#
# Skipping the version-bump commit: `scripts/bump-version.ts` produces exactly one
# commit, `chore: bump to vX.Y.Z`, whose parent CI already verified and whose
# content is version strings only — release.yml then re-runs this entire gate on
# the tagged commit. Running it here too is pure duplication. This is done with a
# job-level `if` and NOT with `[skip ci]` in the commit message: `[skip ci]` is
# evaluated per push event, so it would also kill the tag push that triggers
# release.yml. The three root jobs carry the condition; the build jobs inherit it
# through `needs: [typecheck]` (a skipped dependency skips its dependents). The
# prefix is spelled out inline because the `env` context is not available to a
# job-level `if` — keep it in sync with the script.

jobs:
  typecheck:
    # Quoted: a plain YAML scalar may not contain ": ", which the prefix does.
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: bump to v') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test-linux:
    # Quoted: a plain YAML scalar may not contain ": ", which the prefix does.
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: bump to v') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run test

  test-windows:
    # Quoted: a plain YAML scalar may not contain ": ", which the prefix does.
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: bump to v') }}"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run test

  build-linux:
    needs: [typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-linux-dist.ts

  build-android:
    needs: [typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-android-arm64.ts
      - name: Stage tarball in Android assets
        run: |
          mkdir -p mobile/android/app/src/main/assets
          cp out/vibe-tavern-android-arm64.tar.gz \
             mobile/android/app/src/main/assets/vibe-tavern-android-arm64.tgz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug
        working-directory: mobile/android

  build-windows:
    needs: [typecheck]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes
      - run: bun scripts/build-installer.ts
        env:
          ISCC_PATH: "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe"
      - run: bun scripts/build-windows-dist.ts

  build-docker:
    needs: [typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # NOTE: NO docker/login-action — we don't push. Only verify the image builds.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vibe-tavern:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
