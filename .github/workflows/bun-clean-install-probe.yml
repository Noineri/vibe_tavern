name: Bun clean-install probe

on:
  push:
    branches: [feat/bun-native]

permissions:
  contents: read

jobs:
  probe:
    name: Clean install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun --version
      - run: bun --revision
      - run: bun install --frozen-lockfile
      - run: bun -e 'await import("@rolldown/binding"); await import("lightningcss"); await import("@tailwindcss/oxide"); console.log("NATIVE-IMPORTS-OK")'
      - run: bun run typecheck
      - run: bun run build:web
      - run: git diff --exit-code -- bun.lock
