name: Publish to npm

# Publishes the npm distribution of Vibe Tavern (`bun install -g vibe-tavern`).
#
# ─── Why this is not a job inside release.yml ────────────────────────────────
#
# release.yml builds every artifact and creates the GitHub Release as a DRAFT.
# Nothing there is visible to users until a human presses "Publish release".
# An npm publish cannot wait behind a draft: it is effectively irreversible
# (unpublish is limited to 72 hours and to packages nothing depends on), so it
# must happen on the same human click that ships everything else — the
# `released` event, exactly like the Docker `latest` promotion in
# release-latest.yml. The two run concurrently; neither blocks the other.
#
# `released` (not `published`) for the same reason as release-latest.yml: it
# does not fire for prereleases.
#
# ─── The window users can see ────────────────────────────────────────────────
#
# The in-app updater polls GitHub, so every installed instance learns about the
# release the instant it is published — while this workflow is still building.
# An npm user pressing "Update" in that window would hit a 404. That is handled
# in the product, not here: the npm update path probes the registry first and
# reports "not on npm yet — try again shortly" (see
# services/api/src/domain/update/npm-update.ts). Do not paper over it by
# delaying the GitHub release.
#
# ─── Authentication: trusted publishing (OIDC), no tokens ────────────────────
#
# There is no NPM_TOKEN secret. The package is configured on npmjs.com with a
# trusted publisher pointing at THIS repository and THIS workflow filename.
# Consequences, all of them load-bearing:
#   - `id-token: write` is required, or npm cannot get an OIDC token.
#   - RENAMING THIS FILE BREAKS PUBLISHING. The trusted-publisher binding is by
#     filename; changing it means re-configuring the package on npmjs.com.
#   - Only GitHub-hosted runners work; self-hosted are not supported.
#   - npm CLI >= 11.5.1 and Node >= 22.14 are required, hence the explicit
#     setup-node + npm upgrade below rather than the runner's preinstalled npm.
#   - `repository.url` in the published manifest must match this repo. It is
#     generated by scripts/build-npm-dist.ts; do not hand-edit it apart.
#
# ─── Rehearsing before a real release ────────────────────────────────────────
#
# workflow_dispatch exists so the whole path can be exercised without cutting a
# release: publish a throwaway version under a non-`latest` dist-tag, install
# it, then drop the tag with `npm dist-tag rm vibe-tavern <tag>`. Note that
# GitHub only offers workflow_dispatch for workflows present on the DEFAULT
# branch, so this file must be merged to `dev` before the button appears.

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (X.Y.Z or X.Y.Z-rc.N). Overrides package.json."
        required: true
        type: string
      dist_tag:
        description: "npm dist-tag. Keep off 'latest' for rehearsals."
        required: true
        default: "next"
        type: string

permissions:
  contents: read

concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          # On `released`, build the immutable tagged commit — not whatever the
          # branch has drifted to since. On dispatch, use the selected ref.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Resolve version and dist-tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            VERSION="${RELEASE_TAG#v}"
            DIST_TAG="latest"
            # A real release is strict X.Y.Z — release.yml already refuses to
            # build anything else, so this is a second lock on the same door.
            if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Release tag ${RELEASE_TAG} is not X.Y.Z — refusing to publish to npm."
              exit 1
            fi
            # The tagged commit's package.json must agree, or the published
            # version would silently differ from the release it claims to be.
            PKG_VERSION=$(jq -r '.version' package.json)
            if [ "$PKG_VERSION" != "$VERSION" ]; then
              echo "::error::Tag is v${VERSION} but package.json is v${PKG_VERSION}."
              exit 1
            fi
          else
            VERSION="$INPUT_VERSION"
            DIST_TAG="$INPUT_DIST_TAG"
            if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::'${VERSION}' is not a valid semver version."
              exit 1
            fi
            # Guard the rehearsal against itself: a manual run must never move
            # `latest`, which is what every `bun install -g vibe-tavern` gets.
            if [ "$DIST_TAG" = "latest" ]; then
              echo "::error::Refusing a manual publish to the 'latest' dist-tag. Cut a release instead."
              exit 1
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"
          echo "::notice::Publishing vibe-tavern@${VERSION} under dist-tag '${DIST_TAG}'."

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14; the npm upgrade below needs
          # a Node new enough to run it.
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm to a trusted-publishing-capable version
        run: npm install -g npm@latest

      - name: Skip if this version is already published
        id: published
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          # Re-running the workflow on an already-published version would fail
          # with E403. That is not a problem worth failing a release over —
          # the desired state is already reached.
          if npm view "vibe-tavern@${VERSION}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::vibe-tavern@${VERSION} is already on npm — nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - run: bun install --frozen-lockfile
        if: steps.published.outputs.already == 'false'

      - name: Build npm distribution
        if: steps.published.outputs.already == 'false'
        env:
          # _version.ts prefers VERSION over package.json, which is what lets a
          # dispatch rehearsal stamp an rc build without touching the tree.
          VERSION: ${{ steps.resolve.outputs.version }}
        run: bun scripts/build-npm-dist.ts

      - name: Verify the built package before publishing
        if: steps.published.outputs.already == 'false'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          BUILT=$(jq -r '.version' out/npm-dist/package.json)
          if [ "$BUILT" != "$VERSION" ]; then
            echo "::error::Built package.json says ${BUILT}, expected ${VERSION}."
            exit 1
          fi
          # The launcher must be executable, or the global bin link is dead on
          # POSIX. npm preserves the mode bit from the tarball; nothing later
          # would notice if it were lost.
          test -x out/npm-dist/vibe-tavern.js
          test -f out/npm-dist/web/index.html
          test -f out/npm-dist/drizzle/meta/_journal.json
          test -d out/npm-dist/tokenizers

      - name: Publish
        if: steps.published.outputs.already == 'false'
        working-directory: out/npm-dist
        env:
          DIST_TAG: ${{ steps.resolve.outputs.dist_tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"

      - name: Next step
        if: steps.published.outputs.already == 'false'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          DIST_TAG: ${{ steps.resolve.outputs.dist_tag }}
        run: |
          echo "::notice::Published vibe-tavern@${VERSION} (dist-tag ${DIST_TAG})."
          if [ "$DIST_TAG" != "latest" ]; then
            echo "::notice::Rehearsal install: bun install -g vibe-tavern@${DIST_TAG}"
            echo "::notice::Clean up afterwards: npm dist-tag rm vibe-tavern ${DIST_TAG}"
          fi
